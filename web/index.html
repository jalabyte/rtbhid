    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="RTBH Portal - Remote Triggered Black Hole Controller for DDoS mitigation. Manage BIRD instances, BGP peers, and blackhole prefixes."

    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=nw1" />
    <link rel="manifest" href="/site.webmanifest?v=nw1" />
    <title>Nullwell</title>
    <script>
      // Apply the saved or OS theme before first paint (see src/lib/theme.ts).
      try {
        var t = localStorage.getItem("rtbh-theme");
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.classList.add("dark");
        if (localStorage.getItem("rtbh-text-size") === "large")
          document.documentElement.classList.add("text-large");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
